name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.model.name }} / OTP ${{ matrix.beam.otp }} / Elixir ${{ matrix.beam.elixir }}
    strategy:
      fail-fast: false
      matrix:
        beam:
          - { elixir: "1.20", otp: "29" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.18", otp: "27" }
        model:
          - name: "L6 (default)"
            id: "sentence-transformers/all-MiniLM-L6-v2"
            test_flags: ""
          - name: "L12 (quality)"
            id: "sentence-transformers/all-MiniLM-L12-v2"
            test_flags: "--include l12_only"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.beam.otp }}
          elixir-version: ${{ matrix.beam.elixir }}
      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.beam.otp }}-${{ matrix.beam.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.beam.otp }}-${{ matrix.beam.elixir }}-
      - name: Cache Bumblebee models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bumblebee
          key: ${{ runner.os }}-bumblebee-${{ matrix.model.id }}-${{ hashFiles('**/mix.lock') }}
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test ${{ matrix.model.test_flags }}
        env:
          ALIKE_EMBEDDING_MODEL: ${{ matrix.model.id }}
